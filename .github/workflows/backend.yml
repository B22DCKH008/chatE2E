name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and NATS executable
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps nats --version
      - run: docker compose --parallel 1 up --build -d --wait
      - run: docker compose --profile test run --rm test
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down

